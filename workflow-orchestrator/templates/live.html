<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dev Workflow · 实时流水线</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@500;700;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#f3efe3;
    --paper:#fffdf4;
    --ink:#141414;
    --muted:#5c5a50;
    --faint:#9a968a;
    --rule:#ded8c8;          /* 内部浅分隔线 */
    --line-soft:#c9c2b0;

    --accent:#ffd400;        /* 黄 · 主色 / live / current / focus */
    --cyan:#19c9f0;          /* 进行中 */
    --green:#2fca6b;         /* 已完成 */
    --amber:#ffb020;         /* 评审中 */
    --orange:#ff5d2e;        /* 待修复 */
    --red:#ff3b3b;           /* 已上报 */
    --purple:#a26bff;        /* refactor */
    --pink:#ff5d8f;

    --k-feature:#19c9f0; --k-bugfix:#ff3b3b; --k-refactor:#a26bff; --k-other:#7a7769;

    --border:2px solid var(--ink);
    --shadow:6px 6px 0 0 var(--ink);
    --shadow-sm:3px 3px 0 0 var(--ink);

    --display:"Archivo Black","Archivo",sans-serif;
    --body:"Archivo",-apple-system,"PingFang SC",sans-serif;
    --mono:"Space Mono",ui-monospace,Menlo,Consolas,monospace;
  }

  * { box-sizing:border-box; }
  html,body { height:100%; }
  body {
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:var(--body);
    font-weight:500;
    font-size:14px;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  body::before {
    content:""; position:fixed; inset:0; pointer-events:none; z-index:0;
    background-image:radial-gradient(var(--ink) 1.1px, transparent 1.1px);
    background-size:22px 22px;
    opacity:.055;
  }
  ::-webkit-scrollbar { width:12px; height:12px; }
  ::-webkit-scrollbar-track { background:var(--bg); }
  ::-webkit-scrollbar-thumb { background:var(--ink); border:3px solid var(--bg); }
  ::selection { background:var(--accent); color:var(--ink); }

  .wrap { position:relative; z-index:1; max-width:1600px; margin:0 auto; padding:0 clamp(16px,4vw,40px); }

  /* ---------- topbar ---------- */
  .topbar {
    position:sticky; top:0; z-index:20;
    display:flex; align-items:center; justify-content:space-between; gap:18px;
    padding:16px clamp(16px,4vw,40px);
    background:var(--bg);
    border-bottom:var(--border);
  }
  .brand { display:flex; align-items:center; gap:14px; }
  .brand-mark {
    width:46px; height:46px; flex:0 0 auto;
    background:var(--accent); border:var(--border); box-shadow:var(--shadow-sm);
    display:grid; place-items:center;
  }
  .brand-mark svg { width:24px; height:24px; }
  .brand-title { font-family:var(--display); font-size:21px; letter-spacing:.01em; line-height:1; text-transform:uppercase; }
  .brand-sub { color:var(--muted); font-size:11.5px; letter-spacing:.06em; margin-top:5px; font-family:var(--mono); text-transform:uppercase; }
  .live-sticker {
    display:inline-flex; align-items:center; gap:6px;
    background:var(--accent); border:var(--border); box-shadow:var(--shadow-sm);
    font-family:var(--display); font-size:11px; letter-spacing:.06em;
    padding:4px 9px; margin-top:4px;
  }
  .live-sticker .ld { width:8px; height:8px; border-radius:50%; background:var(--ink); animation:blink 1.2s steps(2,start) infinite; }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.15} }

  .top-actions { display:flex; align-items:center; gap:14px; }
  .refresh { display:flex; align-items:center; gap:10px; padding:8px 14px; border:var(--border); background:var(--paper); box-shadow:var(--shadow-sm); }
  .refresh svg { width:32px; height:32px; transform:rotate(-90deg); }
  .refresh .ring-track { fill:none; stroke:var(--rule); stroke-width:5; }
  .refresh .ring-prog { fill:none; stroke:var(--accent); stroke-width:5; stroke-linecap:butt; transition:stroke-dashoffset .12s linear; }
  .refresh-text { display:flex; flex-direction:column; line-height:1.2; }
  .refresh-text .lbl { font-size:9.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); font-family:var(--mono); }
  .refresh-text .val { font-family:var(--mono); font-size:14px; font-weight:700; font-variant-numeric:tabular-nums; }

  /* ---------- KPIs ---------- */
  .kpis { display:grid; grid-template-columns:1.4fr repeat(5,1fr); gap:16px; margin:28px 0 24px; }
  @media (max-width:1080px){ .kpis{ grid-template-columns:repeat(3,1fr);} .kpi.hero{ grid-column:1/-1; } }
  @media (max-width:620px){ .kpis{ grid-template-columns:repeat(2,1fr);} }
  .kpi {
    position:relative; background:var(--paper); border:var(--border); box-shadow:var(--shadow);
    padding:16px 18px; overflow:hidden; transition:transform .12s ease, box-shadow .12s ease;
  }
  .kpi:hover { transform:translate(3px,3px); box-shadow:3px 3px 0 0 var(--ink); }
  .kpi::before { content:""; position:absolute; left:0; top:0; bottom:0; width:8px; background:var(--ac); }
  .kpi.hero { display:flex; align-items:center; gap:18px; }
  .kpi.hero::before { display:none; }
  .hero-ring { position:relative; width:76px; height:76px; flex:0 0 auto; }
  .hero-ring svg { transform:rotate(-90deg); }
  .hero-ring .rt { fill:none; stroke:var(--rule); stroke-width:9; }
  .hero-ring .rp { fill:none; stroke:var(--green); stroke-width:9; stroke-linecap:butt; transition:stroke-dashoffset .6s cubic-bezier(.2,.8,.2,1); }
  .hero-ring .pct { position:absolute; inset:0; display:grid; place-items:center; font-family:var(--display); font-size:17px; font-variant-numeric:tabular-nums; }
  .hero-meta .h-label { font-family:var(--mono); font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); }
  .hero-meta .h-count { font-family:var(--mono); font-size:13px; color:var(--muted); margin-top:4px; }
  .hero-meta .h-count b { color:var(--ink); font-weight:700; }
  .kpi .k-label { font-family:var(--mono); font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); display:flex; align-items:center; gap:7px; font-weight:700; }
  .kpi .k-dot { width:11px; height:11px; background:var(--ac); border:var(--border); box-shadow:1.5px 1.5px 0 0 var(--ink); }
  .kpi .k-num { font-family:var(--display); font-size:40px; line-height:1; margin-top:10px; font-variant-numeric:tabular-nums; color:var(--ac); -webkit-text-stroke:1.5px var(--ink); }
  .kpi .k-sub { font-family:var(--mono); font-size:11px; color:var(--muted); margin-top:8px; }
  .kpi.done{--ac:var(--green)} .kpi.active{--ac:var(--cyan)} .kpi.reviewing{--ac:var(--amber)}
  .kpi.needs{--ac:var(--orange)} .kpi.escalated{--ac:var(--red)} .kpi.total{--ac:var(--accent)}

  /* ---------- controls ---------- */
  .controls { display:flex; align-items:center; gap:14px; flex-wrap:wrap; margin-bottom:22px; }
  .datefilter { display:flex; align-items:center; gap:8px; padding:6px 8px; border:var(--border); background:var(--paper); box-shadow:var(--shadow-sm); }
  .df-label { font-family:var(--mono); font-size:11px; letter-spacing:.08em; text-transform:uppercase; font-weight:700; color:var(--muted); padding:0 4px; }
  .df-mode { display:flex; border:var(--border); }
  .df-mode-btn { border:none; background:var(--paper); color:var(--ink); font-family:var(--mono); font-size:12px; font-weight:700; padding:6px 10px; cursor:pointer; }
  .df-mode-btn + .df-mode-btn { border-left:var(--border); }
  .df-mode-btn.on { background:var(--accent); }
  .df-range { display:flex; align-items:center; gap:8px; }
  .datefilter input[type="date"] { border:var(--border); background:var(--bg); color:var(--ink); font-family:var(--mono); font-size:12.5px; font-weight:700; padding:6px 8px; outline:none; width:150px; }
  .datefilter input[type="date"]:focus { box-shadow:2px 2px 0 0 var(--accent); }
  .df-sep { color:var(--muted); font-family:var(--mono); font-weight:700; }
  .df-clear { border:var(--border); background:var(--paper); color:var(--ink); font-family:var(--mono); font-size:12px; font-weight:700; padding:6px 10px; cursor:pointer; box-shadow:var(--shadow-sm); transition:transform .1s, box-shadow .1s; }
  .df-clear:hover { transform:translate(2px,2px); box-shadow:1px 1px 0 0 var(--ink); }
  .chips { display:flex; gap:10px; flex-wrap:wrap; }
  .chip {
    display:inline-flex; align-items:center; gap:8px; padding:9px 14px;
    border:var(--border); background:var(--paper); color:var(--ink); box-shadow:var(--shadow-sm);
    font-size:12.5px; font-weight:900; letter-spacing:.01em; cursor:pointer; user-select:none;
    text-transform:uppercase; font-family:var(--mono); transition:transform .1s, box-shadow .1s;
  }
  .chip:hover { transform:translate(2px,2px); box-shadow:1px 1px 0 0 var(--ink); }
  .chip .c-dot { width:10px; height:10px; background:var(--cd,var(--faint)); border:2px solid var(--ink); }
  .chip .c-n { font-weight:400; opacity:.65; }
  .chip.on { background:var(--cc,var(--accent)); transform:translate(2px,2px); box-shadow:1px 1px 0 0 var(--ink); }
  .chip.on .c-dot { background:var(--ink); border-color:var(--ink); }

  /* ---------- board ---------- */
  .board { display:flex; flex-direction:column; gap:30px; padding-bottom:70px; }
  .proj-head { display:flex; align-items:center; gap:16px; margin-bottom:14px; flex-wrap:wrap; }
  .proj-name { font-family:var(--display); font-size:17px; letter-spacing:.01em; text-transform:uppercase; }
  .proj-name .pk { display:inline-block; background:var(--accent); padding:0 6px; border:2px solid var(--ink); box-shadow:2px 2px 0 0 var(--ink); margin-right:6px; }
  .proj-count { font-family:var(--mono); font-size:12.5px; color:var(--muted); font-weight:700; }
  .proj-bar { flex:1; height:14px; border:var(--border); background:var(--paper); overflow:hidden; max-width:420px; }
  .proj-bar > i { display:block; height:100%; background:var(--green); transition:width .6s cubic-bezier(.2,.8,.2,1); border-right:2px solid var(--ink); }

  .task { background:var(--paper); border:var(--border); box-shadow:var(--shadow); margin-bottom:16px; overflow:hidden; transition:transform .12s ease, box-shadow .12s ease; }
  .task:hover { transform:translate(3px,3px); box-shadow:3px 3px 0 0 var(--ink); }
  .task.open:hover { transform:none; box-shadow:var(--shadow); }
  .task.changed { animation:flash 1.1s ease; }
  @keyframes flash { 0%{ box-shadow:8px 8px 0 0 var(--accent);} 100%{ box-shadow:var(--shadow);} }
  .task-head { width:100%; display:grid; grid-template-columns:138px 1fr auto 176px 26px; align-items:center; gap:18px; padding:16px 18px; background:none; border:none; color:inherit; text-align:left; cursor:pointer; font:inherit; }
  .t-status { display:flex; }
  .pill {
    display:inline-flex; align-items:center; gap:8px; font-size:12px; font-weight:900; letter-spacing:.02em;
    padding:6px 11px; border:var(--border); background:var(--pc); color:var(--ink);
    box-shadow:var(--shadow-sm); white-space:nowrap; text-transform:uppercase; font-family:var(--mono);
  }
  .pill .p-ico { width:9px; height:9px; background:var(--ink); border-radius:50%; }
  .pill.live .p-ico { animation:blink 1.2s steps(2,start) infinite; }
  .pill.done{--pc:var(--green)} .pill.active{--pc:var(--cyan)} .pill.reviewing{--pc:var(--amber)}
  .pill.needs_fix{--pc:var(--orange)} .pill.escalated{--pc:var(--red)} .pill.other{--pc:var(--rule)}

  .t-main { min-width:0; }
  .t-id { font-family:var(--mono); font-weight:700; font-size:14px; display:flex; align-items:center; gap:9px; }
  .t-id .term { font-family:var(--mono); font-size:9.5px; letter-spacing:.08em; color:var(--ink); background:var(--green); border:2px solid var(--ink); padding:1px 5px; text-transform:uppercase; font-weight:700; }
  .t-title { color:var(--muted); font-size:12.5px; margin-top:4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-weight:500; }
  .t-tags { display:flex; gap:8px; margin-top:8px; flex-wrap:wrap; }
  .tag { font-family:var(--mono); font-size:10.5px; font-weight:700; letter-spacing:.02em; padding:2px 8px; border:2px solid var(--ink); color:var(--ink); text-transform:uppercase; }
  .tag.kind { background:var(--kc); }
  .tag.kind.feature{--kc:var(--k-feature)} .tag.kind.bugfix{--kc:var(--k-bugfix)} .tag.kind.refactor{--kc:var(--k-refactor)} .tag.kind.other{--kc:var(--k-other)}
  .tag.plain { background:var(--rule); color:var(--ink); }

  .t-pipe { overflow:hidden; }
  .mini { display:flex; align-items:center; }
  .mini .m-node { width:14px; height:14px; flex:0 0 auto; background:var(--paper); border:2px solid var(--ink); }
  .mini .m-node.d{ background:var(--green); }
  .mini .m-node.c{ background:var(--accent); animation:blink 1.2s steps(2,start) infinite; }
  .mini .m-node.sp{ background:var(--paper); border-style:dashed; border-color:var(--orange); }
  .mini .m-line { flex:1; height:3px; background:var(--line-soft); min-width:6px; }
  .mini .m-line.d{ background:var(--green); }

  .t-time { text-align:right; font-family:var(--mono); font-size:11.5px; color:var(--muted); font-variant-numeric:tabular-nums; line-height:1.5; }
  .t-time .dur { color:var(--ink); font-weight:700; font-size:14px; }
  .t-time .dur.run { color:var(--cyan); -webkit-text-stroke:.4px var(--ink); }
  .chev { display:grid; place-items:center; color:var(--ink); transition:transform .25s; }
  .task.open .chev { transform:rotate(180deg); }
  .chev svg { width:20px; height:20px; }

  .task-detail { display:grid; grid-template-rows:0fr; transition:grid-template-rows .36s cubic-bezier(.2,.8,.2,1); }
  .task.open .task-detail { grid-template-rows:1fr; }
  .task-detail > .inner { overflow:hidden; }
  .detail-pad { padding:4px 22px 26px; border-top:2px dashed var(--ink); }
  .detail-grid { display:grid; grid-template-columns:1.15fr 1fr; gap:32px; margin-top:22px; }
  @media (max-width:900px){ .detail-grid{ grid-template-columns:1fr; gap:22px; } }
  .sec-h { font-family:var(--mono); font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--ink); margin:0 0 18px; display:flex; align-items:center; gap:10px; font-weight:700; }
  .sec-h::after { content:""; flex:1; height:2px; background:var(--line-soft); }

  /* full stepper */
  .stepper { display:flex; flex-wrap:wrap; gap:0; }
  .s-node { position:relative; flex:1 1 0; min-width:76px; text-align:center; padding-top:6px; }
  .s-rail { position:absolute; top:19px; left:-50%; width:100%; height:3px; background:var(--line-soft); z-index:0; }
  .s-node:first-child .s-rail { display:none; }
  .s-rail.d { background:var(--green); }
  .s-dot {
    position:relative; z-index:1; width:28px; height:28px; margin:0 auto;
    background:var(--paper); border:var(--border); display:grid; place-items:center;
    font-family:var(--mono); font-weight:700; font-size:12px; color:var(--muted);
  }
  .s-node.d .s-dot { background:var(--green); color:var(--ink); }
  .s-node.c .s-dot { background:var(--accent); color:var(--ink); box-shadow:4px 4px 0 0 var(--ink); animation:blink 1.2s steps(2,start) infinite; }
  .s-node.sp .s-dot { border-style:dashed; border-color:var(--orange); color:var(--orange); }
  .s-lb { font-size:11px; color:var(--muted); margin-top:10px; line-height:1.3; font-weight:700; }
  .s-node.d .s-lb, .s-node.c .s-lb { color:var(--ink); }
  .s-gate { font-family:var(--mono); font-size:9px; letter-spacing:.06em; color:var(--ink); margin-top:4px; text-transform:uppercase; font-weight:700; }
  .s-node.gate .s-gate { background:var(--accent); display:inline-block; padding:0 5px; border:2px solid var(--ink); }

  /* timeline */
  .tl { border-left:3px solid var(--ink); margin-left:6px; padding-left:20px; }
  .tl-ev { position:relative; padding:8px 0; }
  .tl-ev::before { content:""; position:absolute; left:-28px; top:11px; width:13px; height:13px; background:var(--muted); border:2px solid var(--ink); }
  .tl-ev.st-done::before{ background:var(--green);} .tl-ev.st-escalated::before{ background:var(--red);}
  .tl-ev.st-active::before{ background:var(--cyan); animation:blink 1.2s steps(2,start) infinite;}
  .tl-ev.st-reviewing::before{ background:var(--amber);} .tl-ev.st-needs_fix::before{ background:var(--orange);}
  .tl-row { display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; }
  .tl-t { font-family:var(--mono); font-size:11.5px; color:var(--muted); font-variant-numeric:tabular-nums; }
  .tl-s { font-size:13px; font-weight:900; }
  .tl-arrow { color:var(--faint); }
  .tl-step { font-family:var(--mono); font-size:10.5px; font-weight:700; padding:1px 7px; background:var(--accent); color:var(--ink); border:2px solid var(--ink); }
  .tl-meta { display:block; font-size:11.5px; color:var(--muted); margin-top:3px; word-break:break-all; font-family:var(--mono); }
  .files { margin-top:22px; }
  .files .f-h { font-family:var(--mono); font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--ink); margin-bottom:10px; font-weight:700; }
  .files .f-list { display:flex; flex-wrap:wrap; gap:8px; }
  .f-chip { font-family:var(--mono); font-size:11.5px; padding:5px 10px; background:var(--paper); border:2px solid var(--ink); color:var(--ink); box-shadow:2px 2px 0 0 var(--ink); }

  .empty { text-align:center; padding:80px 20px; color:var(--muted); border:3px dashed var(--ink); background:var(--paper); }
  .empty .e-ico { width:58px; height:58px; margin:0 auto 18px; background:var(--accent); border:var(--border); box-shadow:var(--shadow-sm); display:grid; place-items:center; color:var(--ink); }
  .empty .e-ico svg { width:28px; height:28px; }
  .empty h3 { font-family:var(--display); font-size:18px; color:var(--ink); margin:0 0 8px; text-transform:uppercase; }
  .empty p { margin:0; font-size:13px; }
  .empty code { font-family:var(--mono); color:var(--ink); background:var(--accent); padding:1px 6px; border:2px solid var(--ink); font-weight:700; }

  footer { border-top:var(--border); padding:20px clamp(16px,4vw,40px); background:var(--bg); color:var(--muted); font-size:12px; display:flex; justify-content:space-between; gap:12px; flex-wrap:wrap; font-family:var(--mono); }
  footer b { color:var(--ink); font-weight:700; }

  @media (max-width:820px){
    .task-head{ grid-template-columns:1fr auto; gap:10px; }
    .t-pipe, .t-time { display:none; }
  }
  @media (prefers-reduced-motion: reduce){
    *{ animation:none !important; transition:none !important; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="topbar">
    <div class="brand">
      <div class="brand-mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="#141414" stroke-width="2.6" stroke-linecap="square"><path d="M4 7h10M4 12h16M4 17h7"/><rect x="16.6" y="4.6" width="4.8" height="4.8" fill="#141414"/><rect x="12.6" y="14.6" width="4.8" height="4.8" fill="#141414"/></svg>
      </div>
      <div>
        <div class="brand-title">Dev Workflow</div>
        <div class="brand-sub">实时流水线监控</div>
        <span class="live-sticker"><span class="ld"></span>LIVE</span>
      </div>
    </div>
    <div class="top-actions">
      <div class="refresh" title="每 10 秒自动刷新">
        <svg viewBox="0 0 36 36">
          <circle class="ring-track" cx="18" cy="18" r="14"/>
          <circle class="ring-prog" id="ring" cx="18" cy="18" r="14"/>
        </svg>
        <div class="refresh-text">
          <span class="lbl">下次刷新</span>
          <span class="val" id="countdown">10.0s</span>
        </div>
      </div>
    </div>
  </header>

  <section class="kpis" id="kpis"></section>

  <section class="controls">
    <div class="datefilter" title="按任务开始日期过滤（后端 /api/index?from=&to=）">
      <span class="df-label">日期</span>
      <div class="df-mode">
        <button class="df-mode-btn on" data-mode="single" type="button">单日</button>
        <button class="df-mode-btn" data-mode="range" type="button">区间</button>
      </div>
      <input type="date" id="date-single" aria-label="单日">
      <span class="df-range">
        <input type="date" id="date-from" aria-label="开始日期">
        <span class="df-sep">—</span>
        <input type="date" id="date-to" aria-label="结束日期">
      </span>
      <button id="date-clear" class="df-clear" type="button">清除</button>
    </div>
    <div class="chips" id="state-filters"></div>
    <div class="chips" id="kind-filters"></div>
  </section>

  <section class="board" id="board"></section>
</div>

<footer>
  <span>Dev Workflow · 实时仪表盘 · 由 <b>serve_workflow.py</b> 提供服务</span>
  <span id="foot-meta">—</span>
</footer>

<script>
(function () {
  "use strict";
  var REFRESH_MS = 10000;
  var GATES = { evaluate:1, judge:1, "final-evaluate":1, validate:1 };
  var STATE_LABEL = { done:"已完成", escalated:"已上报", active:"进行中", reviewing:"评审中", needs_fix:"待修复", other:"其他" };
  var STATE_ORDER = ["active","reviewing","needs_fix","done","escalated"];

  function esc(v) {
    return String(v == null ? "" : v)
      .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
  }
  function fmtTime(v) {
    if (v == null || v === "") return "—";
    if (typeof v === "number") {
      if (v < 1000000000) return "#" + v;
      var d = new Date(v * 1000);
      var p = function(n){ return (n<10?"0":"")+n; };
      return p(d.getMonth()+1)+"/"+p(d.getDate())+" "+p(d.getHours())+":"+p(d.getMinutes());
    }
    return String(v);
  }
  function fmtFull(v) {
    if (typeof v !== "number" || v < 1000000000) return fmtTime(v);
    var d = new Date(v*1000);
    var p = function(n){ return (n<10?"0":"")+n; };
    return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate())+" "+p(d.getHours())+":"+p(d.getMinutes())+":"+p(d.getSeconds());
  }
  function fmtDuration(start, end) {
    if (typeof start === "number" && typeof end === "number" && end >= start) {
      var m = Math.round((end - start) / 60);
      if (m < 1) return "<1m";
      if (m < 60) return m + "m";
      var h = Math.floor(m / 60);
      return h + "h" + (m % 60 ? " " + (m % 60) + "m" : "");
    }
    return "—";
  }
  function firstEventTime(t){ var e=t.events||[]; for(var i=0;i<e.length;i++) if(typeof e[i].t==="number") return e[i].t; return null; }
  function lastDoneTime(t){ var e=t.events||[]; for(var i=e.length-1;i>=0;i--) if(e[i].to==="done"&&typeof e[i].t==="number") return e[i].t; return null; }

  // ---------- KPI ----------
  var prevKpi = {};
  function animateNum(el, to) {
    var from = prevKpi[el.id];
    if (from == null || from === to) { el.textContent = to; prevKpi[el.id] = to; return; }
    prevKpi[el.id] = to;
    var start = performance.now(), dur = 450;
    function step(now){
      var p = Math.min(1, (now-start)/dur);
      var e = 1 - Math.pow(1-p, 3);
      el.textContent = Math.round(from + (to-from)*e);
      if (p < 1) requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  }

  function renderKpis(tasks) {
    var c = { active:0, reviewing:0, needs_fix:0, done:0, escalated:0 };
    tasks.forEach(function(t){ if (t.state in c) c[t.state]++; });
    var total = tasks.length;
    var done = c.done;
    var pct = total ? Math.round(done/total*100) : 0;

    var circ = 2 * Math.PI * 30;
    var off = circ * (1 - pct/100);
    var html =
      '<div class="kpi hero total">' +
        '<div class="hero-ring">' +
          '<svg viewBox="0 0 76 76" width="76" height="76">' +
            '<circle class="rt" cx="38" cy="38" r="30"/>' +
            '<circle class="rp" id="heroRing" cx="38" cy="38" r="30" stroke-dasharray="'+circ.toFixed(1)+'" stroke-dashoffset="'+off.toFixed(1)+'"/>' +
          '</svg>' +
          '<div class="pct" id="heroPct">0%</div>' +
        '</div>' +
        '<div class="hero-meta">' +
          '<div class="h-label">完成度</div>' +
          '<div class="h-count"><b id="k-total">0</b> / '+total+' 任务</div>' +
        '</div>' +
      '</div>';
    var tiles = [
      { k:"active",    label:"进行中", n:c.active,    sub:Math.round(c.active/total*100||0)+"% 占比" },
      { k:"reviewing", label:"评审中", n:c.reviewing, sub:"并行审查" },
      { k:"needs",     label:"待修复", n:c.needs_fix, sub:"needs fix" },
      { k:"done",      label:"已完成", n:c.done,     sub:Math.round(c.done/total*100||0)+"% 占比" },
      { k:"escalated", label:"已上报", n:c.escalated, sub:"escalated" }
    ];
    tiles.forEach(function(t){
      html += '<div class="kpi '+t.k+'"><div class="k-label"><span class="k-dot"></span>'+t.label+'</div>' +
              '<div class="k-num" id="k-'+t.k+'">0</div>' +
              '<div class="k-sub">'+esc(t.sub)+'</div></div>';
    });
    var box = document.getElementById("kpis");
    var first = box.children.length === 0;
    box.innerHTML = html;
    if (first) prevKpi = {};
    animateNum(document.getElementById("k-total"), total);
    animateNum(document.getElementById("k-active"), c.active);
    animateNum(document.getElementById("k-reviewing"), c.reviewing);
    animateNum(document.getElementById("k-needs"), c.needs_fix);
    animateNum(document.getElementById("k-done"), c.done);
    animateNum(document.getElementById("k-escalated"), c.escalated);
    var hp = document.getElementById("heroPct");
    var fromP = prevKpi.__pct || 0; prevKpi.__pct = pct;
    if (first) fromP = 0;
    (function(){
      var s=performance.now();
      function st(now){ var p=Math.min(1,(now-s)/600); var e=1-Math.pow(1-p,3); hp.textContent=Math.round(fromP+(pct-fromP)*e)+"%"; if(p<1) requestAnimationFrame(st); }
      requestAnimationFrame(st);
    })();
  }

  // ---------- filters ----------
  var stateFilter = "all";
  var kindFilter = "all";
  var prevStates = {};

  function renderFilterChips(tasks) {
    var stCounts = { all:tasks.length };
    STATE_ORDER.forEach(function(s){ stCounts[s]=0; });
    tasks.forEach(function(t){ if (t.state in stCounts) stCounts[t.state]++; });
    var sf = document.getElementById("state-filters");
    var html = chip("all","全部",stCounts.all,"var(--accent)","all"===stateFilter);
    STATE_ORDER.forEach(function(s){
      html += chip(s, STATE_LABEL[s]||s, stCounts[s], "var(--"+s.replace("_","-")+")", s===stateFilter);
    });
    sf.innerHTML = html;
    sf.querySelectorAll(".chip").forEach(function(el){
      el.addEventListener("click", function(){ stateFilter = el.getAttribute("data-v"); renderFilterChips(tasks); filterAndRender(currentData); });
    });

    var kinds = {};
    tasks.forEach(function(t){ var k=t.kind||"other"; kinds[k]=(kinds[k]||0)+1; });
    var kf = document.getElementById("kind-filters");
    var kh = chip("all","全部类型",tasks.length,"var(--accent)","all"===kindFilter);
    Object.keys(kinds).sort().forEach(function(k){
      kh += chip(k, k, kinds[k], "var(--k-"+k+")", k===kindFilter);
    });
    kf.innerHTML = kh;
    kf.querySelectorAll(".chip").forEach(function(el){
      el.addEventListener("click", function(){ kindFilter = el.getAttribute("data-v"); renderFilterChips(tasks); filterAndRender(currentData); });
    });
  }
  function chip(v, label, n, color, on) {
    return '<div class="chip '+(on?"on":"")+'" data-v="'+esc(v)+'" style="--cc:'+color+';">' +
      '<span class="c-dot" style="--cd:'+color+'"></span>'+esc(label)+
      '<span class="c-n">'+n+'</span></div>';
  }
  var dateMode = "single";
  function applyDateMode() {
    var single = dateMode === "single";
    document.getElementById("date-single").style.display = single ? "" : "none";
    document.querySelector(".df-range").style.display = single ? "none" : "";
    document.querySelectorAll(".df-mode-btn").forEach(function(b){
      b.classList.toggle("on", b.getAttribute("data-mode") === dateMode);
    });
  }
  applyDateMode();
  document.querySelectorAll(".df-mode-btn").forEach(function(b){
    b.addEventListener("click", function(){
      dateMode = b.getAttribute("data-mode");
      applyDateMode();
      load();
    });
  });
  document.getElementById("date-single").addEventListener("change", load);
  document.getElementById("date-from").addEventListener("change", load);
  document.getElementById("date-to").addEventListener("change", load);
  document.getElementById("date-clear").addEventListener("click", function(){
    document.getElementById("date-single").value = "";
    document.getElementById("date-from").value = "";
    document.getElementById("date-to").value = "";
    load();
  });

  function passes(t) {
    if (stateFilter !== "all" && t.state !== stateFilter) return false;
    if (kindFilter !== "all" && (t.kind||"other") !== kindFilter) return false;
    return true;
  }

  // ---------- board ----------
  function renderMiniPipe(steps) {
    if (!steps || !steps.length) return '<span style="color:var(--muted);font-size:11px;font-family:var(--mono)">无步骤</span>';
    var out = '<div class="mini">';
    steps.forEach(function(s, i){
      var cls = s.status === "done" ? "d" : s.status === "current" ? "c" : s.status === "skipped" ? "sp" : "";
      if (i > 0) out += '<span class="m-line '+(s.status==="done"||steps[i-1].status==="done"?"d":"")+'"></span>';
      out += '<span class="m-node '+cls+'" title="'+esc(s.label||s.id)+'"></span>';
    });
    return out + "</div>";
  }

  function renderStepper(steps) {
    if (!steps || !steps.length) return '<div style="color:var(--muted);font-size:12px">无步骤信息</div>';
    var out = '<div class="stepper">';
    steps.forEach(function(s, i){
      var cls = s.status === "done" ? "d" : s.status === "current" ? "c" : s.status === "skipped" ? "sp" : "";
      var gate = GATES[s.id] ? " gate" : "";
      var mark = s.status === "done" ? "✓" : (i+1);
      out += '<div class="s-node '+cls+gate+'">' +
        '<div class="s-rail '+(s.status==="done"?"d":"")+'"></div>' +
        '<div class="s-dot">'+mark+'</div>' +
        '<div class="s-lb">'+esc(s.label||s.id)+'</div>' +
        (gate ? '<div class="s-gate">gate</div>' : '') +
        '</div>';
    });
    return out + "</div>";
  }

  function renderTimeline(t) {
    var evs = t.events || [];
    if (!evs.length) return '<div style="color:var(--muted);font-size:12px">暂无事件</div>';
    var out = '<div class="tl">';
    evs.forEach(function(ev){
      var meta = {};
      Object.keys(ev).forEach(function(k){ if (k!=="from"&&k!=="to"&&k!=="t"&&k!=="step") meta[k]=ev[k]; });
      var metaStr = Object.keys(meta).length ? '<span class="tl-meta">'+esc(JSON.stringify(meta))+'</span>' : "";
      var cls = /^[a-z_]+$/.test(ev.to||"") ? "tl-ev st-"+ev.to : "tl-ev";
      var stepTag = ev.step ? '<span class="tl-step">'+esc(ev.step)+'</span>' : "";
      var fromLbl = (ev.from==null) ? "·" : esc(ev.from);
      out += '<div class="'+cls+'"><div class="tl-row">' +
        '<span class="tl-t">'+esc(fmtFull(ev.t))+'</span>' +
        '<span class="tl-s">'+fromLbl+'<span class="tl-arrow"> → </span>'+esc(ev.to||"")+'</span>' +
        stepTag + '</div>' + metaStr + '</div>';
    });
    return out + "</div>";
  }

  function buildDetail(t) {
    var files = (t.changed_files && t.changed_files.length)
      ? '<div class="files"><div class="f-h">变更文件 · '+t.changed_files.length+'</div><div class="f-list">' +
        t.changed_files.map(function(f){ return '<span class="f-chip">'+esc(f)+'</span>'; }).join("") + '</div></div>'
      : '';
    return '<div class="detail-pad"><div class="detail-grid">' +
      '<div><h4 class="sec-h">步骤进度 · protocol pipeline</h4>'+renderStepper(t.steps)+'</div>' +
      '<div><h4 class="sec-h">事件时间线 · event log</h4>'+renderTimeline(t)+'</div>' +
      '</div>'+files+'</div>';
  }

  function renderBoard(data) {
    var board = document.getElementById("board");
    var openKey = window.__openKey || null;
    var html = "";
    var any = false;
    (data.projects||[]).forEach(function(p){
      var pts = (p.tasks||[]).filter(passes);
      if (!pts.length) return;
      any = true;
      var doneN = pts.filter(function(t){ return t.state==="done"; }).length;
      var pct = Math.round(doneN/pts.length*100);
      html += '<div class="project"><div class="proj-head">' +
        '<div class="proj-name"><span class="pk">▸</span>'+esc(p.name)+'</div>' +
        '<div class="proj-count">'+doneN+' / '+pts.length+' 完成</div>' +
        '<div class="proj-bar"><i style="width:'+pct+'%"></i></div>' +
        '</div>';
      pts.forEach(function(t){
        var key = (t.project||"") + "/" + (t.file||t.id||"?");
        var isOpen = (openKey === key);
        var changed = (prevStates[key] !== undefined && prevStates[key] !== t.state) ? " changed" : "";
        var id = t.id || t.file || "?";
        var start = typeof t.started_at === "number" ? t.started_at : firstEventTime(t);
        var end = typeof t.completed_at === "number" ? t.completed_at : lastDoneTime(t);
        var dur = fmtDuration(start, end);
        var running = !t.terminal;
        var stCls = ["done","escalated","active","reviewing","needs_fix"].indexOf(t.state)>=0 ? t.state : "other";
        var live = (stCls==="active"||stCls==="reviewing"||stCls==="needs_fix") ? " live" : "";
        var kindCls = (t.kind||"other");
        html += '<div class="task'+(isOpen?" open":"")+changed+'" data-key="'+esc(key)+'">' +
          '<button class="task-head" type="button">' +
            '<div class="t-status"><span class="pill '+stCls+live+'"><span class="p-ico"></span>'+esc(STATE_LABEL[stCls]||stCls)+'</span></div>' +
            '<div class="t-main">' +
              '<div class="t-id">'+esc(id)+(t.terminal?'<span class="term">done</span>':'')+'</div>' +
              (t.title?'<div class="t-title">'+esc(t.title)+'</div>':'') +
              '<div class="t-tags"><span class="tag kind '+esc(kindCls)+'">'+esc(t.kind||"other")+'</span>' +
                (t.current_step?'<span class="tag plain">▸ '+esc(t.current_step)+'</span>':'')+'</div>' +
            '</div>' +
            '<div class="t-pipe">'+renderMiniPipe(t.steps)+'</div>' +
            '<div class="t-time"><div class="dur'+(running?" run":"")+'">'+esc(dur)+'</div><div>'+esc(fmtTime(start))+' 起</div></div>' +
            '<div class="chev"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="square"><path d="m6 9 6 6 6-6"/></svg></div>' +
          '</button>' +
          '<div class="task-detail"><div class="inner">'+buildDetail(t)+'</div></div>' +
        '</div>';
      });
      html += '</div>';
    });
    if (!any) {
      html = '<div class="empty"><div class="e-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square"><rect x="3" y="4" width="18" height="16"/><path d="M3 9h18M8 4v5"/></svg></div>' +
        '<h3>没有匹配的任务</h3><p>调整筛选条件，或在 <code>~/.local/share/dev-workflow/</code> 下运行一个工作流。</p></div>';
    }
    board.innerHTML = html;

    board.querySelectorAll(".task-head").forEach(function(btn){
      btn.addEventListener("click", function(){
        var task = btn.closest(".task");
        var key = task.getAttribute("data-key");
        var willOpen = !task.classList.contains("open");
        board.querySelectorAll(".task.open").forEach(function(o){ o.classList.remove("open"); });
        if (willOpen) { task.classList.add("open"); window.__openKey = key; }
        else { window.__openKey = null; }
      });
    });
  }

  // ---------- data flow ----------
  var currentData = null;
  function filterAndRender(data) {
    if (!data) return;
    var filtered = { projects: (data.projects||[]).map(function(p){
      return Object.assign({}, p, { tasks:(p.tasks||[]).filter(passes) });
    }).filter(function(p){ return p.tasks.length; }), tasks:(data.tasks||[]).filter(passes) };
    renderKpis(filtered.tasks);
    renderBoard(filtered);
  }

  function render(data) {
    currentData = data;
    var tasks = data.tasks || [];
    var newStates = {};
    tasks.forEach(function(t){ newStates[(t.project||"")+"/"+(t.file||t.id||"?")] = t.state; });
    renderFilterChips(tasks);
    filterAndRender(data);
    prevStates = newStates;
  }

  // ---------- refresh loop + countdown ring ----------
  var RING_C = 2 * Math.PI * 14;
  var ring = document.getElementById("ring");
  ring.setAttribute("stroke-dasharray", RING_C.toFixed(1));
  ring.setAttribute("stroke-dashoffset", "0");
  var lastLoad = performance.now();
  var cdEl = document.getElementById("countdown");

  function tickRing() {
    var elapsed = performance.now() - lastLoad;
    var frac = Math.max(0, 1 - elapsed / REFRESH_MS);
    ring.setAttribute("stroke-dashoffset", (RING_C * (1 - frac)).toFixed(1));
    cdEl.textContent = (frac * (REFRESH_MS/1000)).toFixed(1) + "s";
    requestAnimationFrame(tickRing);
  }
  requestAnimationFrame(tickRing);

  function apiUrl() {
    var q = [];
    if (dateMode === "single") {
      var d = document.getElementById("date-single").value;
      if (d) { q.push("from=" + encodeURIComponent(d)); q.push("to=" + encodeURIComponent(d)); }
    } else {
      var f = document.getElementById("date-from").value;
      var t = document.getElementById("date-to").value;
      if (f) q.push("from=" + encodeURIComponent(f));
      if (t) q.push("to=" + encodeURIComponent(t));
    }
    return "/api/index" + (q.length ? "?" + q.join("&") : "");
  }

  function fingerprint(data) {
    // 只对影响渲染的字段做指纹，忽略 generated_at/updated_at 等每次都在变的元数据，
    // 这样数据无变化时跳过整表重建，避免闪烁。
    return (data.tasks || []).map(function(t){
      var steps = (t.steps || []).map(function(s){ return s.id + ":" + s.status; }).join(",");
      return [t.project, t.file, t.id, t.title, t.kind, t.state, t.terminal, t.current_step,
              t.started_at, t.completed_at, t.event_count, steps,
              (t.changed_files || []).join("\u0001")].join("\u0002");
    }).join("\u0003");
  }

  var lastFp = null;
  function load() {
    fetch(apiUrl(), { cache:"no-store" })
      .then(function(r){ return r.json(); })
      .then(function(data){
        lastLoad = performance.now();
        var fp = fingerprint(data);
        if (fp !== lastFp) {
          lastFp = fp;
          render(data);
        }
        var now = new Date();
        var p = function(n){ return (n<10?"0":"")+n; };
        document.getElementById("foot-meta").textContent = "updated " + p(now.getHours())+":"+p(now.getMinutes())+":"+p(now.getSeconds()) +
          " · " + (data.project_count||0) + " projects · " + (data.tasks||[]).length + " tasks";
      })
      .catch(function(e){
        document.getElementById("foot-meta").textContent = "无法连接服务: " + e;
      });
  }
  load();
  setInterval(load, REFRESH_MS);
})();
</script>
</body>
</html>
